<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#191919">
<title>Add to TalonDeck</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 32px var(--gutter) calc(32px + env(safe-area-inset-bottom));
  }

  .glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(60% 40% at 50% 34%, rgba(244, 75, 75, 0.18), transparent 70%);
  }

  main {
    position: relative;
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    text-align: center;
  }

  .eyebrow {
    margin: 0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--red-zero);
  }

  /* 64:88, the deck's card ratio. */
  .poster {
    width: 176px;
    aspect-ratio: 64 / 88;
    border-radius: 8px;
    border: 2px solid var(--base-white);
    background: var(--dark-one) center / cover no-repeat;
    box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
  }

  h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    line-height: 1.15;
  }

  .subtitle {
    margin: 4px 0 0;
    font-size: 15px;
    color: rgba(255, 255, 255, 0.6);
  }

  .actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
    margin-top: 4px;
  }

  .actions .button { width: 100%; }

  .secondary {
    font-size: 14px;
    color: var(--dark-three);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  footer {
    position: relative;
    font-size: 12px;
    color: var(--dark-two);
  }

  footer a { color: var(--dark-two); }
</style>
</head>
<body>
<div class="glow"></div>

<main>
  <p class="eyebrow">Shared card</p>
  <div class="poster" id="poster" role="img" aria-label="Cover art"></div>
  <div>
    <h1 id="title">A card from TalonDeck</h1>
    <p class="subtitle" id="subtitle"></p>
  </div>
  <div class="actions">
    <a class="button" id="install" href="#">Get TalonDeck</a>
    <a class="secondary" id="open" href="#">Already have the app? Open it</a>
  </div>
</main>

<footer><a href="../">TalonDeck</a> — your media backlog, as a deck of cards</footer>

<script>
  var APP_STORE_URL = "https://apps.apple.com/us/app/talondeck-media-tracker/id6781664803";
  var APP_SCHEME = "talondeck://add";

  // Params travel in the fragment, not the query string: a fragment is never sent in
  // the HTTP request, so a shared card's title never reaches GitHub's servers or logs.
  var params = new URLSearchParams(location.hash.slice(1));

  var KIND_LABELS = { movie: "Movie", tv: "TV Season", book: "Book", game: "Game" };

  var title = params.get("t");
  var kind = params.get("k");
  var year = params.get("y");
  var poster = params.get("p");

  if (title) {
    document.getElementById("title").textContent = title;
    document.title = title + " — Add to TalonDeck";
  }

  var subtitleParts = [];
  if (kind && KIND_LABELS[kind]) subtitleParts.push(KIND_LABELS[kind]);
  if (year) subtitleParts.push(year);
  document.getElementById("subtitle").textContent = subtitleParts.join(" · ");

  if (poster && /^https:\/\//.test(poster)) {
    document.getElementById("poster").style.backgroundImage = 'url("' + poster.replace(/"/g, "%22") + '")';
  }

  document.getElementById("install").href = APP_STORE_URL;

  // The app link is only offered when the fragment actually identifies something —
  // an empty talondeck://add would open the app to nothing.
  var hasPayload = ["tmdb", "imdb", "igdb", "isbn", "olid"].some(function (key) {
    return params.get(key);
  });

  var openLink = document.getElementById("open");
  if (hasPayload) {
    openLink.href = APP_SCHEME + "?" + params.toString();
  } else {
    openLink.remove();
  }
</script>
</body>
</html>
