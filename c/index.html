<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#191919">
<title>Add to TalonDeck</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  /* Card-page styling lives here rather than in style.css: that file is also served
     to the privacy and support repos, and none of this applies to them. */

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 32px 25px calc(32px + env(safe-area-inset-bottom));
  }

  /* A wide, tall ellipse low on the page — the values are the design's radial
     gradient converted from its 390x844 frame to percentages. */
  .glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(45.5% 80.6% at 50% 75.8%,
                rgba(244, 75, 75, 0.18) 0%, rgba(244, 75, 75, 0) 100%);
  }

  .content {
    position: relative;
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    text-align: center;
  }

  .masthead {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
  }

  .masthead img {
    width: 250px;
    max-width: 100%;
    height: auto;
    display: block;
  }

  .masthead p {
    margin: 0;
    font-size: 16px;
    line-height: 1.4;
    color: var(--dark-three);
  }

  /* The card ---------------------------------------------------------------
     Every dimension is a ratio of --card-w, so the card scales as one piece.
     The corner markers are the app's own asset catalog SVGs, and they carry the
     white edge bars, so they sit outside the art and overlap the card's border. */

  /* The white edge is the card's own background with the face inset on top of it,
     not a CSS border. A border would be rounded to whole pixels by the browser
     while the corner offsets kept the exact value, leaving the markers hanging
     half a pixel outside the card. */
  .card {
    --card-w: 176px;
    --card-edge: calc(var(--card-w) * 0.02593);
    position: relative;
    width: var(--card-w);
    aspect-ratio: 64 / 88;
    background: var(--base-white);
    border-radius: calc(var(--card-w) * 0.05187);
    box-shadow: 0 0 calc(var(--card-w) * 0.05187) rgba(0, 0, 0, 0.5);
    flex-shrink: 0;
  }

  .card__face {
    position: absolute;
    inset: var(--card-edge);
    border-radius: calc(var(--card-w) * 0.026);
    overflow: hidden;
  }

  /* Seen only where the artwork does not cover it — a missing poster still reads
     as that suit's card rather than as a hole. */
  .card--spades .card__face,
  .card--clubs .card__face { background: var(--base-white); }

  .card--hearts .card__face,
  .card--diamonds .card__face { background: var(--red-zero); }

  .card__art {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card__corner {
    position: absolute;
    width: calc(var(--card-w) * 0.3372);
    height: auto;
  }

  .card__corner--tl { top: 0; left: 0; }

  .card__corner--br {
    bottom: 0;
    right: 0;
    transform: rotate(180deg);
  }

  /* The empty state's fanned deck ------------------------------------------
     Four dashed slots overlapping to exactly 340 wide. The widths and the
     negative margin are percentages of that, so the fan scales with the column
     instead of overflowing a narrow phone. */

  .deck {
    display: flex;
    width: 100%;
  }

  .deck__slot {
    position: relative;
    width: 51.765%;
    aspect-ratio: 64 / 88;
    flex-shrink: 0;
    border: 2.282px dashed var(--base-white);
    border-radius: 4px;
    background: var(--dark-zero);
  }

  .deck__slot:not(:last-child) { margin-right: -35.686%; }

  /* Ratios of the slot, not fixed pixels, so the markers shrink with the fan on a
     narrow phone instead of growing relatively larger. Percentage insets resolve
     against the slot's width horizontally and its height vertically, hence the
     two different numbers for what is a square offset in the design. */
  .deck__slot img {
    position: absolute;
    width: 15.97%;
    height: auto;
  }

  .deck__slot img:first-of-type { top: 5.77%; left: 7.99%; }

  .deck__slot img:last-of-type {
    bottom: 5.77%;
    right: 7.99%;
    transform: rotate(180deg);
  }

  /* Title and actions ------------------------------------------------------ */

  .titleblock {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
  }

  .titleblock h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    line-height: 30px;
    /* Capped so a long title cannot push the buttons below the fold. */
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .titleblock p {
    margin: 0;
    font-size: 15px;
    line-height: 22px;
  }

  .actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
  }

  .actions .button { width: 100%; }

  .secondary {
    font-size: 14px;
    line-height: 20px;
    color: var(--dark-three);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="glow"></div>

<main class="content">
  <div class="masthead">
    <img src="../assets/logomark.svg" alt="TalonDeck" width="250" height="39">
    <p>Interactive media tracker</p>
  </div>

  <div class="card" id="card" hidden>
    <div class="card__face">
      <img class="card__art" id="cardArt" alt="" hidden>
    </div>
    <img class="card__corner card__corner--tl" id="cornerTL" src="" alt="">
    <img class="card__corner card__corner--br" id="cornerBR" src="" alt="">
  </div>

  <div class="deck" id="deck" hidden>
    <div class="deck__slot">
      <img src="../assets/empty-spades.svg" alt="" width="27" height="27">
      <img src="../assets/empty-spades.svg" alt="" width="27" height="27">
    </div>
    <div class="deck__slot">
      <img src="../assets/empty-hearts.svg" alt="" width="27" height="27">
      <img src="../assets/empty-hearts.svg" alt="" width="27" height="27">
    </div>
    <div class="deck__slot">
      <img src="../assets/empty-clubs.svg" alt="" width="27" height="27">
      <img src="../assets/empty-clubs.svg" alt="" width="27" height="27">
    </div>
    <div class="deck__slot">
      <img src="../assets/empty-diamonds.svg" alt="" width="27" height="27">
      <img src="../assets/empty-diamonds.svg" alt="" width="27" height="27">
    </div>
  </div>

  <div class="titleblock">
    <h1 id="title">Add to TalonDeck</h1>
    <p id="subtitle">All your media under one app</p>
  </div>

  <div class="actions">
    <a class="button" id="install" href="https://apps.apple.com/us/app/talondeck-media-tracker/id6781664803">Get TalonDeck</a>
    <a class="secondary" id="open" href="#">Already have the app? Open it</a>
  </div>
</main>

<script>
  var APP_SCHEME = "talondeck://add";

  // Params travel in the fragment, not the query string: a fragment is never sent in
  // the HTTP request, so a shared card's title never reaches GitHub's servers or logs.
  var params = new URLSearchParams(location.hash.slice(1));

  var SUITS = { movie: "spades", tv: "hearts", book: "clubs", game: "diamonds" };
  var ID_KEYS = ["tmdb", "imdb", "igdb", "isbn", "olid"];

  var title = params.get("t");
  var kind = params.get("k");
  // The card's own subtitle, passed through as the app renders it: a year for a
  // movie, a platform for a game, an author for a book. Rebuilding it from parts
  // here would mean two implementations of the same rule, drifting.
  var subtitle = params.get("s");
  var poster = params.get("p");
  var suit = SUITS[kind];

  var hasPayload = ID_KEYS.some(function (key) { return params.get(key); });

  // The card state needs something to show; anything less falls back to the
  // empty deck, which reads as an invitation rather than as a broken page.
  if (title && suit) {
    var card = document.getElementById("card");
    var tl = document.getElementById("cornerTL");
    var br = document.getElementById("cornerBR");
    tl.src = br.src = "../assets/corner-" + suit + ".svg";
    card.classList.add("card--" + suit);
    card.hidden = false;

    if (poster && /^https:\/\//.test(poster)) {
      var art = document.getElementById("cardArt");
      art.src = poster;
      art.alt = title;
      art.hidden = false;
      // A poster that fails to load leaves the suit-coloured card, not a broken icon.
      art.onerror = function () { art.remove(); };
    }

    document.getElementById("title").textContent = title;
    var subtitleEl = document.getElementById("subtitle");
    if (subtitle) {
      subtitleEl.textContent = subtitle;
    } else {
      subtitleEl.remove();
    }
    document.title = title + " — Add to TalonDeck";
  } else {
    document.getElementById("deck").hidden = false;
  }

  var openLink = document.getElementById("open");
  if (hasPayload) {
    openLink.href = APP_SCHEME + "?" + params.toString();
  } else {
    // An empty talondeck://add would open the app to nothing.
    openLink.remove();
  }
</script>
</body>
</html>
